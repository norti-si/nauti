<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nauti - Mascote Norti Design</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap');
        
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #000000;
            color: #ffffff;
            margin: 0;
            overflow-x: hidden;
        }

        .glow-mint {
            box-shadow: 0 0 40px rgba(45, 212, 191, 0.08);
        }

        .btn-expression {
            transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .btn-expression:hover {
            transform: translateY(-2px);
            border-color: rgba(45, 212, 191, 0.4);
            background-color: rgba(255, 255, 255, 0.04);
        }

        .btn-expression.active {
            background-color: #18181b;
            border-color: #2dd4bf;
            color: #2dd4bf;
            box-shadow: 0 0 15px rgba(45, 212, 191, 0.2);
        }

        .btn-expression.active i {
            color: #2dd4bf !important;
        }

        /* Custom scrollbars for clean presentation */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #000000;
        }
        ::-webkit-scrollbar-thumb {
            background: #27272a;
            border-radius: 9999px;
        }
    </style>
</head>
<body class="min-h-screen bg-black text-white flex flex-col justify-between p-4 md:p-8 select-none">

    <!-- Header Section -->
    <header class="max-w-5xl mx-auto w-full flex items-center justify-between pb-4 border-b border-zinc-900">
        <div class="flex items-center gap-3">
            <div class="w-9 h-9 rounded-full bg-zinc-950 border border-teal-500/30 flex items-center justify-center text-teal-400">
                <i data-lucide="sparkles" class="w-4 h-4"></i>
            </div>
            <div>
                <h1 class="text-lg font-bold tracking-tight text-white flex items-center gap-2">
                    Nauti <span class="text-[10px] px-2 py-0.5 rounded-full bg-teal-950/60 text-teal-300 border border-teal-800/40">Norti Design</span>
                </h1>
                <p class="text-xs text-zinc-500">O pequeno explorador que te ajuda a encontrar o teu norte.</p>
            </div>
        </div>
        
        <div class="flex items-center gap-2">
            <button onclick="triggerTyping()" title="Simular Digitação" class="px-3 py-1.5 rounded-xl bg-zinc-900 hover:bg-zinc-800 border border-zinc-800 text-xs text-zinc-300 flex items-center gap-1.5 transition-all">
                <i data-lucide="keyboard" class="w-3.5 h-3.5 text-teal-400"></i>
                <span class="hidden sm:inline">Digitar</span>
            </button>
            <button onclick="triggerCelebration()" title="Comemorar" class="px-3 py-1.5 rounded-xl bg-zinc-900 hover:bg-zinc-800 border border-zinc-800 text-xs text-zinc-300 flex items-center gap-1.5 transition-all">
                <i data-lucide="party-popper" class="w-3.5 h-3.5 text-teal-400"></i>
                <span class="hidden sm:inline">Conquista</span>
            </button>
        </div>
    </header>

    <!-- Canvas Interactive Viewer -->
    <main class="flex-1 flex flex-col items-center justify-center my-4 max-w-5xl mx-auto w-full">
        <div class="relative w-full aspect-square max-w-[460px] bg-black rounded-3xl border border-zinc-900 flex items-center justify-center overflow-hidden glow-mint">
            <canvas id="nautiCanvas" class="w-full h-full cursor-pointer"></canvas>
            
            <!-- Live Status Overlay -->
            <div id="statusBadge" class="absolute top-4 left-4 flex items-center gap-2 px-3 py-1 rounded-full bg-zinc-950/90 border border-zinc-800 text-[11px] text-zinc-400 backdrop-blur-md transition-all">
                <span class="w-2 h-2 rounded-full bg-teal-400 animate-pulse"></span>
                <span id="statusText">Acompanhando jornada</span>
            </div>

            <!-- Compass Badge -->
            <div class="absolute top-4 right-4 flex items-center gap-1.5 px-3 py-1 rounded-full bg-zinc-950/90 border border-zinc-800 text-[11px] text-zinc-400 backdrop-blur-md">
                <i data-lucide="compass" class="w-3.5 h-3.5 text-teal-400"></i>
                <span>Norti Design</span>
            </div>
            
            <!-- Interactive Tip -->
            <div class="absolute bottom-3 text-[11px] text-zinc-600 font-medium pointer-events-none">
                Passe o cursor sobre o Nauti ou pressione teclas para interagir
            </div>
        </div>
    </main>

    <!-- UI Controls Footer -->
    <footer class="max-w-5xl mx-auto w-full space-y-4 border-t border-zinc-900 pt-4">
        <!-- Expression Selector -->
        <div>
            <div class="flex items-center justify-between mb-2">
                <span class="text-xs font-semibold text-zinc-500 uppercase tracking-wider">Expressões do Nauti</span>
                <span class="text-[11px] text-zinc-600">Interatividade em Tempo Real</span>
            </div>
            
            <div class="grid grid-cols-2 sm:grid-cols-4 md:grid-cols-7 gap-2">
                <button onclick="setExpression('feliz')" id="btn-feliz" class="btn-expression active flex flex-col items-center justify-center p-2.5 rounded-2xl bg-zinc-950 border border-zinc-800 text-zinc-300">
                    <i data-lucide="smile" class="w-4 h-4 mb-1 text-teal-400"></i>
                    <span class="text-xs font-medium">Feliz</span>
                </button>

                <button onclick="setExpression('curioso')" id="btn-curioso" class="btn-expression flex flex-col items-center justify-center p-2.5 rounded-2xl bg-zinc-950 border border-zinc-800 text-zinc-300">
                    <i data-lucide="help-circle" class="w-4 h-4 mb-1 text-teal-400"></i>
                    <span class="text-xs font-medium">Curioso</span>
                </button>

                <button onclick="setExpression('surpreso')" id="btn-surpreso" class="btn-expression flex flex-col items-center justify-center p-2.5 rounded-2xl bg-zinc-950 border border-zinc-800 text-zinc-300">
                    <i data-lucide="zap" class="w-4 h-4 mb-1 text-teal-400"></i>
                    <span class="text-xs font-medium">Surpreso</span>
                </button>

                <button onclick="setExpression('pensativo')" id="btn-pensativo" class="btn-expression flex flex-col items-center justify-center p-2.5 rounded-2xl bg-zinc-950 border border-zinc-800 text-zinc-300">
                    <i data-lucide="brain" class="w-4 h-4 mb-1 text-teal-400"></i>
                    <span class="text-xs font-medium">Pensativo</span>
                </button>

                <button onclick="setExpression('animado')" id="btn-animado" class="btn-expression flex flex-col items-center justify-center p-2.5 rounded-2xl bg-zinc-950 border border-zinc-800 text-zinc-300">
                    <i data-lucide="sparkles" class="w-4 h-4 mb-1 text-teal-400"></i>
                    <span class="text-xs font-medium">Animado</span>
                </button>

                <button onclick="setExpression('triste')" id="btn-triste" class="btn-expression flex flex-col items-center justify-center p-2.5 rounded-2xl bg-zinc-950 border border-zinc-800 text-zinc-300">
                    <i data-lucide="frown" class="w-4 h-4 mb-1 text-teal-400"></i>
                    <span class="text-xs font-medium">Triste</span>
                </button>

                <button onclick="setExpression('dormindo')" id="btn-dormindo" class="btn-expression flex flex-col items-center justify-center p-2.5 rounded-2xl bg-zinc-950 border border-zinc-800 text-zinc-300 col-span-2 sm:col-span-1">
                    <i data-lucide="moon" class="w-4 h-4 mb-1 text-teal-400"></i>
                    <span class="text-xs font-medium">Dormindo</span>
                </button>
            </div>
        </div>

        <!-- Quick Behavior Triggers -->
        <div class="flex flex-wrap items-center justify-between gap-2 bg-zinc-950 p-3 rounded-2xl border border-zinc-900">
            <span class="text-xs text-zinc-400 font-medium flex items-center gap-1.5">
                <i data-lucide="activity" class="w-3.5 h-3.5 text-teal-400"></i> Reações de Mundo:
            </span>
            <div class="flex flex-wrap items-center gap-2 text-xs">
                <button onclick="triggerAction('lookAround')" class="px-2.5 py-1 rounded-lg bg-zinc-900 hover:bg-zinc-800 text-zinc-300 border border-zinc-800 transition-colors">
                    🔍 Explorar ambiente
                </button>
                <button onclick="triggerAction('niggle')" class="px-2.5 py-1 rounded-lg bg-zinc-900 hover:bg-zinc-800 text-zinc-300 border border-zinc-800 transition-colors">
                    ✨ Pulinho
                </button>
                <button onclick="triggerAction('sleep')" class="px-2.5 py-1 rounded-lg bg-zinc-900 hover:bg-zinc-800 text-zinc-300 border border-zinc-800 transition-colors">
                    💤 Forçar inatividade
                </button>
            </div>
        </div>
    </footer>

    <!-- Interactive Script -->
    <script>
        lucide.createIcons();

        const canvas = document.getElementById('nautiCanvas');
        const ctx = canvas.getContext('2d');
        const statusText = document.getElementById('statusText');

        // State variables
        let currentExpression = 'feliz';
        let isTyping = false;
        let typingTimer = null;
        let idleTimer = 0;
        let lastInteractionTime = Date.now();

        // Physics & Motion Smoothness
        let targetLookX = 0;
        let targetLookY = 0;
        let currentLookX = 0;
        let currentLookY = 0;

        // Organic Spring Physics (Squish & Stretch)
        let bodyY = 0;
        let targetBodyY = 0;
        let bodyVelocityY = 0;
        
        let scaleX = 1;
        let scaleY = 1;
        let scaleVelocityX = 0;
        let scaleVelocityY = 0;

        let time = 0;
        let blinkProgress = 0;
        let isBlinking = false;
        let blinkTimer = 0;

        let particles = [];
        let stars = [];

        function resizeCanvas() {
            const rect = canvas.getBoundingClientRect();
            canvas.width = rect.width * window.devicePixelRatio;
            canvas.height = rect.height * window.devicePixelRatio;
            ctx.scale(window.devicePixelRatio, window.devicePixelRatio);
        }

        window.addEventListener('resize', resizeCanvas);

        // Track cursor movement for responsive gaze & reaction
        canvas.addEventListener('mousemove', (e) => {
            const rect = canvas.getBoundingClientRect();
            const x = e.clientX - rect.left - rect.width / 2;
            const y = e.clientY - rect.top - rect.height / 2;
            
            targetLookX = Math.max(-24, Math.min(24, x / 8));
            targetLookY = Math.max(-18, Math.min(18, y / 8));
            
            resetIdleTimer();
            if (currentExpression === 'dormindo') {
                setExpression('curioso');
            }
        });

        canvas.addEventListener('mouseleave', () => {
            targetLookX = 0;
            targetLookY = 0;
        });

        canvas.addEventListener('click', () => {
            // Organic Squish bounce on click
            applyImpulse(0, 15, 0.85, 1.22);
            resetIdleTimer();
            if (currentExpression === 'dormindo') {
                setExpression('feliz');
            } else if (currentExpression === 'feliz') {
                setExpression('animado');
            }
        });

        // Keyboard interaction reaction
        window.addEventListener('keydown', () => {
            resetIdleTimer();
            triggerTyping();
        });

        function resetIdleTimer() {
            lastInteractionTime = Date.now();
            if (currentExpression === 'dormindo' && idleTimer > 600) {
                setExpression('curioso');
            }
            idleTimer = 0;
        }

        function triggerTyping() {
            isTyping = true;
            statusText.innerText = "Interessado no que você digita...";
            applyImpulse(0, -6, 1.08, 0.92);

            clearTimeout(typingTimer);
            typingTimer = setTimeout(() => {
                isTyping = false;
                statusText.innerText = "Acompanhando jornada";
            }, 1200);
        }

        function triggerCelebration() {
            setExpression('animado');
            applyImpulse(0, -25, 0.82, 1.28);
            statusText.innerText = "Comemorando conquistas! 🎉";
            
            // Spawn celebratory stars
            for (let i = 0; i < 18; i++) {
                stars.push({
                    x: canvas.width / (2 * window.devicePixelRatio) + (Math.random() - 0.5) * 140,
                    y: canvas.height / (2 * window.devicePixelRatio) + (Math.random() - 0.5) * 80,
                    size: 4 + Math.random() * 6,
                    vx: (Math.random() - 0.5) * 4,
                    vy: -2 - Math.random() * 4,
                    alpha: 1
                });
            }
        }

        function triggerAction(action) {
            resetIdleTimer();
            if (action === 'lookAround') {
                setExpression('curioso');
                targetLookX = (Math.random() - 0.5) * 40;
                targetLookY = (Math.random() - 0.5) * 20;
                statusText.innerText = "Explorando o ambiente";
            } else if (action === 'niggle') {
                applyImpulse(0, -18, 0.88, 1.18);
            } else if (action === 'sleep') {
                setExpression('dormindo');
            }
        }

        function applyImpulse(dY, dVY, sX, sY) {
            bodyVelocityY += dVY;
            scaleX = sX;
            scaleY = sY;
        }

        function setExpression(expr) {
            currentExpression = expr;
            document.querySelectorAll('.btn-expression').forEach(btn => btn.classList.remove('active'));
            const activeBtn = document.getElementById(`btn-${expr}`);
            if (activeBtn) activeBtn.classList.add('active');
            
            particles = [];
            
            const titles = {
                'feliz': 'Acompanhando jornada',
                'curioso': 'Observando ideias...',
                'surpreso': 'Descoberta incrível!',
                'pensativo': 'Encontrando soluções...',
                'animado': 'Comemorando conquista!',
                'triste': 'Apoiando em momentos difíceis',
                'dormindo': 'Descansando no seu canto...'
            };
            statusText.innerText = titles[expr] || 'Acompanhando jornada';
        }

        // Norti Teal Compass Star Helper
        function drawNortiStar(ctx, cx, cy, outerRadius, innerRadius, color, alpha = 1) {
            ctx.save();
            ctx.globalAlpha = alpha;
            let rot = Math.PI / 2 * 3;
            let step = Math.PI / 4;

            ctx.beginPath();
            ctx.moveTo(cx, cy - outerRadius);
            for (let i = 0; i < 4; i++) {
                let x = cx + Math.cos(rot) * outerRadius;
                let y = cy + Math.sin(rot) * outerRadius;
                ctx.lineTo(x, y);
                rot += step;

                x = cx + Math.cos(rot) * innerRadius;
                y = cy + Math.sin(rot) * innerRadius;
                ctx.lineTo(x, y);
                rot += step;
            }
            ctx.lineTo(cx, cy - outerRadius);
            ctx.closePath();
            
            ctx.fillStyle = color;
            ctx.shadowColor = color;
            ctx.shadowBlur = 8;
            ctx.fill();
            ctx.restore();
        }

        function animate() {
            time += 0.035;

            // Inactivity sleep trigger (after 18 seconds without interaction)
            if (Date.now() - lastInteractionTime > 18000 && currentExpression !== 'dormindo') {
                setExpression('dormindo');
            }

            // Interpolation for smooth gaze movement (Lerp)
            currentLookX += (targetLookX - currentLookX) * 0.08;
            currentLookY += (targetLookY - currentLookY) * 0.08;

            // Spring physics for body position and elastic scale
            const k = 0.12; // Spring stiffness
            const damping = 0.78; // Friction

            let forceY = (targetBodyY - bodyY) * k;
            bodyVelocityY = (bodyVelocityY + forceY) * damping;
            bodyY += bodyVelocityY;

            // Scale Spring Physics
            scaleVelocityX = (scaleVelocityX + (1 - scaleX) * 0.15) * 0.75;
            scaleX += scaleVelocityX;

            scaleVelocityY = (scaleVelocityY + (1 - scaleY) * 0.15) * 0.75;
            scaleY += scaleVelocityY;

            // Blink logic
            blinkTimer++;
            if (blinkTimer > 220 && !isBlinking) {
                if (Math.random() < 0.06) {
                    isBlinking = true;
                    blinkTimer = 0;
                }
            }

            if (isBlinking) {
                blinkProgress += 0.28;
                if (blinkProgress >= 1) {
                    blinkProgress = 1;
                    isBlinking = false;
                }
            } else if (blinkProgress > 0) {
                blinkProgress -= 0.28;
                if (blinkProgress <= 0) blinkProgress = 0;
            }

            const w = canvas.getBoundingClientRect().width;
            const h = canvas.getBoundingClientRect().height;
            const centerX = w / 2;
            const centerY = h / 2;

            // 1. PURE BLACK BACKGROUND (#000000)
            ctx.fillStyle = '#000000';
            ctx.fillRect(0, 0, w, h);

            // Subtle Background Teal Aura Glow
            const bgGlow = ctx.createRadialGradient(centerX, centerY, 10, centerX, centerY, 180);
            bgGlow.addColorStop(0, 'rgba(45, 212, 191, 0.04)');
            bgGlow.addColorStop(1, 'rgba(0, 0, 0, 0)');
            ctx.fillStyle = bgGlow;
            ctx.fillRect(0, 0, w, h);

            // Natural Floating Wave
            let floatY = Math.sin(time * 1.6) * 7 + bodyY;
            let breathY = Math.sin(time * 2.2) * 0.018;

            if (currentExpression === 'animado') {
                floatY = Math.abs(Math.sin(time * 5)) * -18 + bodyY;
            } else if (currentExpression === 'dormindo') {
                floatY = Math.sin(time * 0.9) * 2.5 + bodyY;
            } else if (isTyping) {
                floatY = Math.sin(time * 8) * 3 + bodyY;
            }

            // Head Tilt Calculation
            let headTilt = currentLookX * 0.012;
            if (currentExpression === 'curioso') headTilt += 0.18;
            if (currentExpression === 'triste') headTilt -= 0.09;

            ctx.save();
            ctx.translate(centerX, centerY + floatY + 8);
            ctx.rotate(headTilt);
            ctx.scale(scaleX * (1 - breathY), scaleY * (1 + breathY));

            // Soft Ground Shadow
            const shadowGrad = ctx.createRadialGradient(0, 72, 4, 0, 72, 65);
            shadowGrad.addColorStop(0, 'rgba(45, 212, 191, 0.1)');
            shadowGrad.addColorStop(0.5, 'rgba(255, 255, 255, 0.03)');
            shadowGrad.addColorStop(1, 'transparent');
            ctx.fillStyle = shadowGrad;
            ctx.beginPath();
            ctx.ellipse(0, 72, 58, 14, 0, 0, Math.PI * 2);
            ctx.fill();

            // --- 2. TENTACLES (4 Chubby Stubby Legs) ---
            const legPositions = [-36, -12, 12, 36];
            legPositions.forEach((xPos, idx) => {
                const legWave = Math.sin(time * 2.5 + idx * 0.9) * 4.5;
                ctx.save();
                ctx.translate(xPos, 40);

                // Off-white / Cream Gradient
                const legGrad = ctx.createLinearGradient(0, -10, 0, 18);
                legGrad.addColorStop(0, '#f7f5f0');
                legGrad.addColorStop(1, '#e3decb');

                ctx.fillStyle = legGrad;
                ctx.beginPath();
                ctx.arc(0, legWave, 13.5, 0, Math.PI * 2);
                ctx.fill();

                // Subtle inner leg shadow
                ctx.fillStyle = 'rgba(0, 0, 0, 0.05)';
                ctx.beginPath();
                ctx.arc(0, legWave + 3, 10, 0, Math.PI);
                ctx.fill();

                ctx.restore();
            });

            // --- 3. MAIN BODY / HEAD (Coucou Off-White Plush Style) ---
            const headRadius = 66;

            // Cream Plush Gradient
            const bodyGrad = ctx.createRadialGradient(-18, -24, 6, 0, 0, headRadius + 18);
            bodyGrad.addColorStop(0, '#ffffff');
            bodyGrad.addColorStop(0.45, '#f7f4eb');
            bodyGrad.addColorStop(0.82, '#e9e3d3');
            bodyGrad.addColorStop(1, '#d5cca8');

            ctx.fillStyle = bodyGrad;
            ctx.beginPath();
            ctx.arc(0, -8, headRadius, Math.PI * 0.82, Math.PI * 0.18, false);
            ctx.quadraticCurveTo(headRadius + 2, 46, 0, 48);
            ctx.quadraticCurveTo(-headRadius - 2, 46, -headRadius * 0.98, -8);
            ctx.closePath();
            ctx.fill();

            // Subtle Contour Highlight
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.6)';
            ctx.lineWidth = 1.2;
            ctx.stroke();

            // --- 4. NORTI DESIGN MINT-TEAL GUIDE STAR EMBLEM ---
            const starY = -headRadius + 12;
            drawNortiStar(ctx, 0, starY, 7.5, 2.8, '#2dd4bf', 0.95);

            // --- 5. EARS / CHEEKS / EYES ---
            const eyeOffsetX = 22;
            const eyeOffsetY = -2;
            const eyeLookX = currentExpression === 'dormindo' ? 0 : currentLookX;
            const eyeLookY = currentExpression === 'dormindo' ? 0 : currentLookY;

            // Rosy Pink Cheeks
            ctx.fillStyle = 'rgba(251, 113, 133, 0.26)';
            ctx.beginPath();
            ctx.ellipse(-eyeOffsetX - 8 + eyeLookX * 0.15, eyeOffsetY + 16, 9.5, 5.5, 0, 0, Math.PI * 2);
            ctx.ellipse(eyeOffsetX + 8 + eyeLookX * 0.15, eyeOffsetY + 16, 9.5, 5.5, 0, 0, Math.PI * 2);
            ctx.fill();

            // EYES RENDERING
            if (currentExpression === 'dormindo') {
                ctx.strokeStyle = '#18181b';
                ctx.lineWidth = 2.8;
                ctx.lineCap = 'round';

                ctx.beginPath();
                ctx.arc(-eyeOffsetX, eyeOffsetY + 6, 7, Math.PI * 0.15, Math.PI * 0.85);
                ctx.stroke();

                ctx.beginPath();
                ctx.arc(eyeOffsetX, eyeOffsetY + 6, 7, Math.PI * 0.15, Math.PI * 0.85);
                ctx.stroke();

            } else if (currentExpression === 'feliz') {
                ctx.strokeStyle = '#18181b';
                ctx.lineWidth = 3.2;
                ctx.lineCap = 'round';

                [-eyeOffsetX, eyeOffsetX].forEach((ex) => {
                    ctx.save();
                    ctx.translate(ex + eyeLookX * 0.4, eyeOffsetY + eyeLookY * 0.4);
                    ctx.beginPath();
                    ctx.arc(0, 4, 8, Math.PI * 1.15, Math.PI * 1.85);
                    ctx.stroke();
                    ctx.restore();
                });

            } else if (currentExpression === 'surpreso') {
                [-eyeOffsetX - 1, eyeOffsetX + 1].forEach((ex) => {
                    ctx.save();
                    ctx.translate(ex + eyeLookX, eyeOffsetY + eyeLookY);
                    
                    ctx.beginPath();
                    ctx.arc(0, 0, 10, 0, Math.PI * 2);
                    ctx.fillStyle = '#18181b';
                    ctx.fill();

                    // White Pupil Highlight
                    ctx.fillStyle = '#ffffff';
                    ctx.beginPath();
                    ctx.arc(-2.5, -3, 3.2, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.restore();
                });

            } else if (currentExpression === 'triste') {
                [-eyeOffsetX, eyeOffsetX].forEach((ex) => {
                    ctx.save();
                    ctx.translate(ex + eyeLookX, eyeOffsetY + eyeLookY + 2);

                    ctx.beginPath();
                    ctx.arc(0, 0, 8, 0, Math.PI * 2);
                    ctx.fillStyle = '#18181b';
                    ctx.fill();

                    ctx.fillStyle = '#ffffff';
                    ctx.beginPath();
                    ctx.arc(-2, -2, 2.2, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.restore();
                });

            } else if (currentExpression === 'pensativo') {
                [-eyeOffsetX, eyeOffsetX].forEach((ex) => {
                    ctx.save();
                    ctx.translate(ex - 4, eyeOffsetY - 5);

                    ctx.beginPath();
                    ctx.arc(0, 0, 8, 0, Math.PI * 2);
                    ctx.fillStyle = '#18181b';
                    ctx.fill();

                    ctx.fillStyle = '#ffffff';
                    ctx.beginPath();
                    ctx.arc(-2, -2, 2.5, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.restore();
                });

            } else {
                // Default / Curioso / Animado Pupil
                [-eyeOffsetX, eyeOffsetX].forEach((ex) => {
                    ctx.save();
                    ctx.translate(ex + eyeLookX, eyeOffsetY + eyeLookY);

                    if (blinkProgress > 0.5) {
                        ctx.beginPath();
                        ctx.moveTo(-7, 0);
                        ctx.lineTo(7, 0);
                        ctx.strokeStyle = '#18181b';
                        ctx.lineWidth = 2.6;
                        ctx.stroke();
                    } else {
                        ctx.beginPath();
                        ctx.arc(0, 0, 8.5, 0, Math.PI * 2);
                        ctx.fillStyle = '#18181b';
                        ctx.fill();

                        // Multi-highlights
                        ctx.fillStyle = '#ffffff';
                        ctx.beginPath();
                        ctx.arc(-2.5, -3, 2.8, 0, Math.PI * 2);
                        ctx.fill();
                        ctx.beginPath();
                        ctx.arc(2, 2.5, 1.3, 0, Math.PI * 2);
                        ctx.fill();
                    }
                    ctx.restore();
                });
            }

            // --- MOUTH ---
            ctx.strokeStyle = '#18181b';
            ctx.fillStyle = '#18181b';
            ctx.lineWidth = 2.2;
            ctx.lineCap = 'round';

            const mouthY = eyeOffsetY + 15 + eyeLookY * 0.3;

            ctx.beginPath();
            if (currentExpression === 'feliz' || currentExpression === 'animado') {
                ctx.arc(eyeLookX * 0.2, mouthY - 3, 5.2, Math.PI * 0.1, Math.PI * 0.9);
                ctx.stroke();
            } else if (currentExpression === 'surpreso') {
                ctx.beginPath();
                ctx.ellipse(eyeLookX * 0.2, mouthY, 3.2, 4.8, 0, 0, Math.PI * 2);
                ctx.fill();
            } else if (currentExpression === 'triste') {
                ctx.arc(eyeLookX * 0.2, mouthY + 3, 5, Math.PI * 1.1, Math.PI * 1.9);
                ctx.stroke();
            } else if (currentExpression === 'dormindo') {
                ctx.beginPath();
                ctx.moveTo(-2.5, mouthY);
                ctx.lineTo(2.5, mouthY);
                ctx.stroke();
            } else if (currentExpression === 'pensativo') {
                ctx.beginPath();
                ctx.arc(eyeLookX * 0.2 + 2, mouthY, 3.2, 0, Math.PI * 0.85);
                ctx.stroke();
            } else {
                // Curioso - Gentle Small Smile
                ctx.arc(eyeLookX * 0.2 + 1, mouthY - 2, 4.5, Math.PI * 0.1, Math.PI * 0.85);
                ctx.stroke();
            }

            ctx.restore(); // Restore body transformation

            // --- 6. PARTICLES & REACTION EFFECTS ---
            if (currentExpression === 'dormindo') {
                if (Math.random() < 0.03) {
                    particles.push({
                        x: centerX + 38,
                        y: centerY - 28,
                        size: 11 + Math.random() * 6,
                        alpha: 1,
                        vy: -0.65,
                        vx: 0.3
                    });
                }

                particles.forEach((p, idx) => {
                    p.x += p.vx;
                    p.y += p.vy;
                    p.alpha -= 0.008;
                    ctx.font = `600 ${p.size}px 'Plus Jakarta Sans', sans-serif`;
                    ctx.fillStyle = `rgba(45, 212, 191, ${Math.max(0, p.alpha)})`;
                    ctx.fillText('z', p.x, p.y);

                    if (p.alpha <= 0) particles.splice(idx, 1);
                });

            } else if (currentExpression === 'animado') {
                if (Math.random() < 0.25) {
                    particles.push({
                        x: centerX + (Math.random() - 0.5) * 160,
                        y: centerY + (Math.random() - 0.5) * 120,
                        size: 3 + Math.random() * 5,
                        alpha: 1
                    });
                }

                particles.forEach((p, idx) => {
                    p.alpha -= 0.03;
                    drawNortiStar(ctx, p.x, p.y, p.size, p.size / 2.5, '#2dd4bf', Math.max(0, p.alpha));
                    if (p.alpha <= 0) particles.splice(idx, 1);
                });
            }

            // Render Celebratory Stars
            stars.forEach((s, idx) => {
                s.x += s.vx;
                s.y += s.vy;
                s.vy += 0.12; // Gravity
                s.alpha -= 0.015;

                drawNortiStar(ctx, s.x, s.y, s.size, s.size / 2.5, '#2dd4bf', Math.max(0, s.alpha));
                if (s.alpha <= 0) stars.splice(idx, 1);
            });

            requestAnimationFrame(animate);
        }

        resizeCanvas();
        animate();
    </script>
</body>
</html>
